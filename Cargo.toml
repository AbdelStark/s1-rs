[workspace]
resolver = "3"
members = ["crates/s1", "crates/s1-derive", "crates/s1-test"]
default-members = ["crates/s1"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AbdelStark/s1-rs"
homepage = "https://github.com/AbdelStark/s1-rs"
authors = ["Abdel Bakhta"]
publish = false

[workspace.dependencies]
indexmap = { version = "2.11", features = ["serde"] }
pretty_assertions = "1.4"
proc-macro2 = "1.0"
quote = "1.0"
s1 = { path = "crates/s1", version = "0.1.0" }
s1-derive = { path = "crates/s1-derive", version = "0.1.0" }
s1-test = { path = "crates/s1-test", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }
trybuild = "1.0"
typesafe-rs = { path = "../typesafe-rs/crates/typesafe-rs" }

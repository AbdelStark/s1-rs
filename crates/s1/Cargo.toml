[package]
name = "s1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
description = "Typed System One decisions for Rust: derive Choice, Score, and Questions, then ask and gate on Verdict::{Act, Review, Escalate}."
readme = "../../README.md"
keywords = ["typesafe", "system-one", "decision", "derive", "classification"]
categories = ["api-bindings", "rust-patterns"]

[features]
default = []
backend-typesafe-rs = ["dep:typesafe-rs"]

[dependencies]
indexmap.workspace = true
s1-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
typesafe-rs = { workspace = true, optional = true }

[dev-dependencies]
indexmap.workspace = true
pretty_assertions.workspace = true
s1-test.workspace = true
serde_json.workspace = true
tokio.workspace = true
trybuild.workspace = true

[[example]]
name = "triage"
path = "../../examples/triage.rs"

[[example]]
name = "moderation"
path = "../../examples/moderation.rs"

[[test]]
name = "typesafe_rs_backend"
required-features = ["backend-typesafe-rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
